services:
  - type: web
    name: gestao-despesas-api
    runtime: node
    buildCommand: npm install
    startCommand: node apps/api/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
    disk:
      name: gestao-despesas-data
      mountPath: /opt/render/project/src/apps/api/data
      sizeGB: 1
